name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # Artifact: upload the folder itself so GitHub's own zip is the only layer.
      - uses: actions/upload-artifact@v4
        with:
          name: CodeApp-windows-x64
          path: build/windows/x64/runner/Release
      # Release asset: a single zip.
      - name: Zip for release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CodeApp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: CodeApp-windows-x64.zip

  macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip .app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/codeapp.app CodeApp-macos.zip
      # .app bundles need a zip made with ditto (keeps permissions/symlinks),
      # so this one is unavoidably a zip inside the artifact zip.
      - uses: actions/upload-artifact@v4
        with:
          name: CodeApp-macos
          path: CodeApp-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: CodeApp-macos.zip

  ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned build. To install on a device, sign it with your Apple
      # developer account (Xcode, or a tool like iOS App Signer / Sideloadly).
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr CodeApp-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CodeApp-ios-unsigned
          path: CodeApp-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: CodeApp-ios-unsigned.ipa

  # Every push to main refreshes a rolling "latest" pre-release, so the three
  # downloads have stable, login-free URLs with no extra zip layer:
  #   https://github.com/<owner>/<repo>/releases/download/latest/CodeApp-windows-x64.zip
  release-latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [windows, macos, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Move the latest tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" >/dev/null 2>&1 || true
          gh release delete latest --repo "${{ github.repository }}" --yes >/dev/null 2>&1 || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.sha }})
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*

  # Tagged releases (git tag v0.1.0 && git push --tags) become proper releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, macos, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
